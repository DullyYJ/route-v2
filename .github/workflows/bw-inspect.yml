name: Inspect board-writer (read-only)

# board-writer 워커의 현재 Cloudflare 설정(바인딩 이름·종류, 호환 날짜, 크론)만 읽어 출력한다. 값·시크릿은 출력하지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [ claude/jolly-darwin-dtzab9 ]
    paths: [ .github/workflows/bw-inspect.yml ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Read worker settings
        run: |
          set -e
          [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ] || { echo "::error::이 저장소에 CF_API_TOKEN / CF_ACCOUNT_ID 시크릿이 없습니다"; exit 1; }
          B=https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/board-writer
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "$B/settings" > s.json
          python3 - <<'PY'
          import json
          j = json.load(open("s.json"))
          print("success:", j.get("success"), "errors:", [e.get("message") for e in j.get("errors", [])])
          r = j.get("result") or {}
          print("compatibility_date:", r.get("compatibility_date"), "flags:", r.get("compatibility_flags"))
          print("usage_model:", r.get("usage_model"), "placement:", r.get("placement"))
          for b in r.get("bindings", []):
              print("binding:", b.get("type"), b.get("name"))
          PY
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "$B/schedules" | python3 -c "import json,sys; j=json.load(sys.stdin); print('crons:', [s.get('cron') for s in (j.get('result') or {}).get('schedules', [])])"
