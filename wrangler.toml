name = "route-v2"
main = "route-v2-worker.js"
compatibility_date = "2024-01-01"

# 2026-10-02: 한국 사용자가 미국(LAX) 엣지로 붙어 D1(서울)·한국 공공 API 왕복마다 태평양을 건넜다(실측).
# 워커를 서울 근처에서 실행하게 해 D1/KV/외부 API 왕복을 짧게 한다. 되돌리려면 이 블록만 지우면 된다.
[placement]
region = "aws:ap-northeast-2"

[triggers]
crons = ["*/10 17-18 * * *", "5,15,25,35,45,55 17-18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "subway-db"
database_id = "c06de2e6-d6bc-401c-be32-25fde0b5f747"

[[services]]
binding = "BUSAPI"
service = "gentle-lab-7e47subway-api"

[[kv_namespaces]]
binding = "ROWS_KV"
id = "dc7124fce2d946768165f47fc58d6b7e"
